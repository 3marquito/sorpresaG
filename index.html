<body>
<div class="from">De: GildeguyXXX</div>
<div class="sky"></div><div class="cloud b"></div><div class="cloud c"></div><div class="tree" style="left:1vw;--s:1.25"></div><div class="tree" style="left:13vw;--s:.9"></div><div class="tree" style="left:68vw;--s:1.05"></div><div class="tree" style="left:80vw;--s:1.3"></div><div class="tree" style="left:92vw;--s:.85"></div>
<div class="night"></div><div class="stars"></div>
<div class="wrap">
  <h1>⛏️ <span style="color:#ff3b30">C</span><span style="color:#ff9500">a</span><span style="color:#ffe600">s</span><span style="color:#34d12f">i</span><span style="color:#3a8dff">n</span><span style="color:#b23bff">o</span> <span style="color:#ff3b30">M</span><span style="color:#ff9500">i</span><span style="color:#ffe600">n</span><span style="color:#34d12f">e</span><span style="color:#3a8dff">c</span><span style="color:#b23bff">r</span><span style="color:#ff3b30">a</span><span style="color:#ff9500">f</span><span style="color:#ffe600">t</span></h1>
  <div class="hud"><span>Vidas: <span id="hp">❤️❤️❤️</span></span><span>🗿 Tótems: <span id="tt">0</span></span><span class="blue">💎 Armadura: <span id="dm">0</span></span><span>🎂 <span id="wn">0</span></span></div>
  <div class="machine">
    <div class="cabinet"><div class="reels"><div class="reel" id="r0">🧟</div><div class="reel" id="r1">💀</div><div class="reel" id="r2">🎂</div></div></div>
    <div class="lever" id="lever"><div class="stick"></div><div class="base"></div><div class="knob" id="knob" title="Baja la palanca"></div></div>
  </div>

  <button class="btn" id="mus">🔊 Música: ON</button>
  <div class="legend">🧟 Malo · 🗿 +Tótem · 💀 -1 vida · 💎 +1 Diamante · 🏆 ¡Ganaste!<br>🏆×3 ¡Feliz cumpleaños! · 🗿×2 o 3 +Tótem · 💀×2 o 3 -1 vida · 💎×2 +Protección azul · 🧟×2 quita protección · 🧟×3 -1 vida</div>
</div>
<script>
const S=[
 {e:"🧟",t:"Malo",c:"rgb"},
 {e:"🗿",t:"+ Tótem",c:"rgb"},
 {e:"💀",t:"-1 vida",c:"red"},
 {e:"💎",t:"+1 Diamante",c:"cyan"},
 {e:"🎂",t:"¡GANASTE!",c:"gold"}
];
let hp=3,tt=0,dm=0,wn=0,busy=false,dead=false;
const $=id=>document.getElementById(id),reels=[0,1,2].map(i=>$("r"+i)),knob=$("knob"),msg=$("msg");
const rnd=()=>Math.floor(Math.random()*S.length);
function hud(){$("hp").textContent=hp>0?"❤️".repeat(hp):"💔";$("tt").textContent=tt;$("dm").textContent=dm;$("wn").textContent=wn}
function say(t,c){msg.innerHTML="";const s=document.createElement("span");s.className=c||"";s.textContent=t;msg.appendChild(s)}
function spin(){
  if(busy||dead)return;busy=true;say("Girando...");
  reels.forEach(r=>r.classList.remove("hit"));
  const res=[rnd2(),rnd2(),rnd2()],ids=[],tk=setInterval(()=>sfx("tick"),100);spins++;sfx("pull");
  reels.forEach((r,i)=>{
    r.classList.add("spin");ids[i]=setInterval(()=>r.textContent=S[rnd()].e,70);
    setTimeout(()=>{clearInterval(ids[i]);r.classList.remove("spin");r.textContent=S[res[i]].e;sfx("stop");if(i===2){clearInterval(tk);finish(res)}},900+i*500);
  });
}
function finish(r){
  const n=i=>r.filter(x=>x===i).length;
  let txt="Nada... sigue intentando",cls="",snd="lose",k=-1;
  if(n(4)===3){k=4;wn++;txt="¡FELIZ CUMPLEAÑOS!";cls="gold";snd="birthday"}
  else if(n(1)>=2){k=1;tt++;txt="+ Tótem";cls="rgb";snd="win"}
  else if(n(3)===2){k=3;dm++;txt="+1 Pieza de diamante · Protección";cls="blue";snd="win"}
  else if(n(2)>=2){
    k=2;cls="red";snd="bad";
    if(dm>0){dm--;txt="-1 vida (¡El diamante te protegió!)"}
    else if(tt>0){tt--;txt="-1 vida (¡Tótem usado!)"}
    else{hp--;txt="-1 vida";if(hp<=0){dead=true;txt="-1 vida · Has muerto";$("reset").hidden=false}}
  }
  else if(n(0)===3){k=0;cls="rgb";snd="bad";txt="Malo · -1 vida";
    if(dm>0){dm--;txt="Malo (¡El diamante te protegió!)"}
    else if(tt>0){tt--;txt="Malo (¡Tótem usado!)"}
    else{hp--;if(hp<=0){dead=true;txt="Malo · Has muerto";$("reset").hidden=false}}}
  else if(n(0)===2){k=0;cls="rgb";snd="bad";if(dm>0){dm--;txt="Malo · -1 protección"}else txt="Malo · no tenías protección"}
  if(k>=0)reels.forEach((x,i)=>{if(r[i]===k)x.classList.add("hit")});
  sfx(snd);say(txt,cls);hud();busy=false;
}
function finishOld(r){
  if(!(r[0]===r[1]&&r[1]===r[2])){say("Nada... necesitas 3 iguales");sfx("lose");busy=false;return}
  const k=r[0];
  const s=S[k];let txt=s.t;
  reels.forEach(x=>x.classList.add("hit"));
  sfx(k===4?"jackpot":(k===0||k===2)?"bad":"win");
  if(k===1)tt++;
  else if(k===2){
    if(tt>0){tt--;txt="-1 vida (¡Tótem usado!)"}
    else{hp--;if(hp<=0){dead=true;txt="-1 vida · Has muerto";$("reset").hidden=false}}
  }
  else if(k===3)dm++;
  else if(k===4)wn++;
  say(txt,s.c);hud();busy=false;
}
let AC=null;
function ac(){try{if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume()}catch(e){}return AC}
function tone(f,t0,d,type,vol,f2){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+t0;o.type=type||"square";o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(vol||.08,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.02)}
function sfx(n){
 if(n==="pull"){tone(160,0,.18,"sawtooth",.1,60);tone(900,.12,.06,"square",.06);tone(1300,.16,.08,"square",.06)}
 else if(n==="tick")tone(700+Math.random()*500,0,.04,"square",.035);
 else if(n==="stop"){tone(220,0,.09,"triangle",.12,110);tone(1800,0,.03,"square",.04)}
 else if(n==="win")[784,988,1175,1568].forEach((f,i)=>tone(f,i*.09,.14,"square",.07));
 else if(n==="jackpot")[523,659,784,1047,1319,1568,2093].forEach((f,i)=>{tone(f,i*.1,.2,"square",.07);tone(f*2,i*.1+.03,.12,"triangle",.04)});
 else if(n==="bad")[330,247,196,131].forEach((f,i)=>tone(f,i*.14,.2,"sawtooth",.08));
 else if(n==="birthday"){let t=0;const b=.26;[[392,.75],[392,.25],[440,1],[392,1],[523.3,1],[493.9,2],[392,.75],[392,.25],[440,1],[392,1],[587.3,1],[523.3,2],[392,.75],[392,.25],[784,1],[659.3,1],[523.3,1],[493.9,1],[440,1],[698.5,.75],[698.5,.25],[659.3,1],[523.3,1],[587.3,1],[523.3,2]].forEach(([f,d])=>{tone(f,t,d*b+.1,"square",.07);tone(f*2,t,d*b+.05,"triangle",.03);t+=d*b});tone(523.3,t,.6,"square",.06);tone(659.3,t,.6,"square",.05);tone(784,t,.6,"square",.05)}
 else if(n==="lose")tone(200,0,.25,"triangle",.07,120);
}
let musicOn=true,musicTimer=null,step=0;
const MEL=[261.6,329.6,392,523.3,392,329.6,293.7,349.2,440,587.3,440,349.2,261.6,392,329.6,246.9];
const BASS=[130.8,130.8,146.8,98,130.8,130.8,110,98];
function musicTick(){
  if(!musicOn)return;
  const f=MEL[step%MEL.length];
  tone(f,0,.9,"sine",.035);
  if(step%2===0)tone(f*2,.02,.5,"triangle",.012);
  if(step%4===0)tone(BASS[(step/4)%BASS.length],0,1.6,"triangle",.04);
  step++;
}
function startMusic(){if(musicTimer||!musicOn)return;ac();musicTimer=setInterval(musicTick,520)}
document.addEventListener("pointerdown",startMusic,{once:true});
document.querySelector(".legend").innerHTML="🎁 ???<br>🗿×2/3 +Tótem: te salva de un golpe<br>💎×2/3 +Armadura: bloquea un golpe<br>💀×2/3 -1 vida (¡te flechan!)<br>🧟×2 rompe tu armadura · 🧟×3 -1 vida<br>Los golpes gastan primero armadura, luego tótem y al final vidas.";
$("wn").parentElement.style.display="none";
function burst(cols,count,big){
  const rc=document.querySelector(".reels").getBoundingClientRect(),cx=rc.left+rc.width/2,cy=rc.top+rc.height/2;
  for(let i=0;i<count;i++){
    const p=document.createElement("div"),s=6+Math.random()*8;
    p.style.cssText="position:fixed;z-index:5;pointer-events:none;width:"+s+"px;height:"+s+"px;left:"+cx+"px;top:"+cy+"px;background:"+cols[i%cols.length];
    document.body.appendChild(p);
    const a=Math.random()*Math.PI*2,d=(big?190:110)*(.4+Math.random()*.9);
    p.animate([{transform:"translate(0,0)",opacity:1},{transform:"translate("+Math.cos(a)*d+"px,"+(Math.sin(a)*d-(big?120:50))+"px) rotate("+Math.random()*360+"deg)",opacity:0}],{duration:900+Math.random()*700,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>p.remove();
  }
}
const _fin=finish;
finish=function(r){
  const b=[hp,tt,dm,wn];
  _fin(r);
  if(wn>b[3]){$("wn").parentElement.style.display="";burst(["#f00","#ff9500","#ffe600","#34d12f","#3a8dff","#b23bff"],90,true)}
  else if(tt>b[1])burst(["#ffd75e","#fff6a8","#fc3"],26);
  else if(dm>b[2])burst(["#4ff","#4aa8ff","#bff"],26);
  else if(hp<b[0]||dm<b[2]||tt<b[1])burst(["#f33","#a00","#600"],16);
};
// Las 5 primeras tiradas no pueden sacar torta
let spins=0;
function rnd2(){let k;do{k=rnd()}while(spins<5&&k===4);return k}
// Veneno
let poisonT=null,poisonEnd=0,wasMusic=true;
const pz=document.createElement("div");pz.className="poison";pz.hidden=true;document.body.appendChild(pz);
const pl=document.createElement("div");pl.className="plabel";pl.hidden=true;document.body.appendChild(pl);
const ds=document.createElement("div");ds.className="deadscreen";ds.hidden=true;
ds.innerHTML="<div>☠️ Moriste envenenado</div><small>La página se cerró</small><button class='btn' id='reopen'>Volver a abrir</button>";
document.body.appendChild(ds);
function endPoison(){clearInterval(poisonT);poisonT=null;pz.hidden=true;pl.hidden=true}
function startPoison(){
  if(poisonT||dead)return;
  poisonEnd=Date.now()+60000;pz.hidden=false;pl.hidden=false;
  let last=-1;
  const upd=()=>{
    const left=Math.max(0,Math.ceil((poisonEnd-Date.now())/1000));
    pl.innerHTML="☠️ ¡Te dio veneno!<br>Consigue el 🎁<br><b>0:"+String(left).padStart(2,"0")+"</b>";
    if(left<=10&&left>0&&left!==last){last=left;tone(880,0,.08,"square",.05)}
    if(left<=0){endPoison();poisonDeath()}
  };
  upd();poisonT=setInterval(upd,250);
}
function poisonDeath(){dead=true;wasMusic=musicOn;musicOn=false;sfx("bad");ds.hidden=false}
$("reopen").onclick=()=>{
  ds.hidden=true;musicOn=wasMusic;hp=3;tt=0;dm=0;wn=0;dead=false;
  $("reset").hidden=true;$("wn").parentElement.style.display="none";say("Baja la palanca ⬇️");hud();
};
$("reset").addEventListener("click",endPoison);
const _fin2=finish;
finish=function(r){
  const n0=r.filter(x=>x===0).length,armor=dm,w=wn;
  _fin2(r);
  if(wn>w||dead)endPoison();
  else if(n0===2&&armor===0){startPoison();say("Malo · ¡Te dio veneno! Tienes 1 minuto","rgb")}
};
// Reglas finales (sobrescriben la función finish anterior)
function hurt(pre,why){
  if(dm>0){dm--;return pre+why+" · ¡La armadura de diamante te protegió!"}
  if(tt>0){tt--;return pre+why+" · ¡El tótem te salvó!"}
  hp--;if(hp<=0){dead=true;$("reset").hidden=false;return pre+"-1 vida · ¡Has muerto!"}
  return pre+"-1 vida · "+why;
}
function finish(r){
  const n=i=>r.filter(x=>x===i).length;
  let txt="Nada esta vez... sigue girando",cls="",snd="lose",k=-1;
  if(n(4)===3){k=4;wn++;txt="¡FELIZ CUMPLEAÑOS!";cls="gold";snd="birthday"}
  else if(n(4)===2){k=4;txt="¡Casi! Se siente que algo grande se acerca...";cls="gold"}
  else if(n(1)>=2){k=1;tt++;txt="+ Tótem de la inmortalidad";cls="rgb";snd="win"}
  else if(n(3)>=2){k=3;dm++;txt="+1 Armadura de diamante";cls="blue";snd="win"}
  else if(n(2)>=2){k=2;cls="red";snd="bad";txt=hurt("","¡Te flecharon!")}
  else if(n(0)===3){k=0;cls="rgb";snd="bad";txt=hurt("Malo · ","¡Horda de zombies!")}
  else if(n(0)===2){k=0;cls="rgb";snd="bad";if(dm>0){dm--;txt="Malo · ¡Los zombies rompieron tu armadura! -1 armadura"}else txt="Malo · ¡Zombies cerca! No tenías armadura que romper"}
  if(k>=0)reels.forEach((x,i)=>{if(r[i]===k)x.classList.add("hit")});
  sfx(snd);say(txt,cls);hud();busy=false;
}
$("mus").onclick=()=>{musicOn=!musicOn;$("mus").textContent=musicOn?"🔊 Música: ON":"🔇 Música: OFF";if(musicOn)startMusic();else{clearInterval(musicTimer);musicTimer=null}};
const MAX=130;let startY=0,dragging=false,moved=0;
knob.addEventListener("pointerdown",e=>{if(busy||dead)return;ac();startMusic();dragging=true;moved=0;startY=e.clientY;knob.classList.add("drag");knob.setPointerCapture(e.pointerId)});
knob.addEventListener("pointermove",e=>{if(!dragging)return;const y=Math.max(0,Math.min(MAX,e.clientY-startY));moved=Math.max(moved,y);knob.style.transform="translateY("+y+"px)"});
function release(){
  if(!dragging)return;dragging=false;knob.classList.remove("drag");
  if(moved>80){knob.style.transform="";spin()}
  else if(moved<6){knob.style.transform="translateY("+MAX+"px)";setTimeout(()=>{knob.style.transform="";spin()},250)}
  else knob.style.transform="";
}
knob.addEventListener("pointerup",release);knob.addEventListener("pointercancel",release);
$("reset").onclick=()=>{hp=3;tt=0;dm=0;wn=0;dead=false;$("reset").hidden=true;say("Baja la palanca ⬇️");hud()};
hud();
</script>
